<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LawMemory - แอพท่องจำประมวลกฎหมายอาญา และแพ่งฯ</title>
  <meta name="description" content="แอพท่องจำประมวลกฎหมายแพ่งและพาณิชย์ และประมวลกฎหมายอาญา พร้อมเกมพิมพ์ท่องจำ 5 ระดับ และระบบทบทวน Spaced Repetition">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            prompt: ['Prompt', 'sans-serif'],
            sarabun: ['Sarabun', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Custom Styles & Thai Fonts -->
  <link rel="stylesheet" href="css/custom.css">
  <link rel="manifest" href="manifest.json">
</head>
<body class="h-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 flex flex-col font-prompt transition-colors duration-200">

  <!-- Main Navigation Header -->
  <header class="sticky top-0 z-40 bg-white/90 dark:bg-slate-800/90 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-700/80 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <!-- App Logo & Branding -->
        <div class="flex items-center space-x-3 cursor-pointer" onclick="window.appInstance?.switchView('library')">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-violet-500 flex items-center justify-center text-white text-xl shadow-md">
            ⚖️
          </div>
          <div>
            <div class="font-black text-lg text-slate-900 dark:text-white tracking-tight flex items-center space-x-1.5">
              <span>LawMemory</span>
              <span class="text-[10px] font-bold px-1.5 py-0.5 bg-indigo-100 dark:bg-indigo-900/60 text-indigo-700 dark:text-indigo-300 rounded-md">THAI LAW</span>
            </div>
            <p class="text-[11px] text-slate-400 -mt-0.5 font-normal">ท่องตัวบท & วางหลักกฎหมาย</p>
          </div>
        </div>

        <!-- Desktop Navigation Tabs -->
        <nav class="hidden md:flex items-center space-x-1 bg-slate-100/80 dark:bg-slate-900/50 p-1.5 rounded-2xl border border-slate-200/60 dark:border-slate-800">
          <button class="nav-link px-4 py-2 rounded-xl text-sm font-bold bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 transition flex items-center space-x-1.5" data-view="library">
            <span>🏛️</span>
            <span>คลังมาตรา</span>
          </button>

          <button class="nav-link px-4 py-2 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition flex items-center space-x-1.5" data-view="game">
            <span>🎮</span>
            <span>เกมพิมพ์ท่องจำ</span>
          </button>

          <button class="nav-link relative px-4 py-2 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition flex items-center space-x-1.5" data-view="stats">
            <span>📈</span>
            <span>สถิติ & ทบทวน</span>
            <span id="nav-due-badge" class="hidden absolute -top-1 -right-1 px-1.5 py-0.5 bg-amber-500 text-white text-[10px] font-black rounded-full shadow-sm animate-bounce">0</span>
          </button>

          <button class="nav-link px-4 py-2 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition flex items-center space-x-1.5" data-view="settings">
            <span>⚙️</span>
            <span>จัดการข้อมูล</span>
          </button>
        </nav>

        <!-- Right Side: Streak & Theme Toggle -->
        <div class="flex items-center space-x-3">
          <!-- Daily Streak Indicator -->
          <div class="flex items-center space-x-1.5 px-3 py-1.5 bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-900/60 rounded-2xl text-amber-700 dark:text-amber-300 text-xs font-bold" title="จำนวนวันท่องต่อเนื่อง (Daily Streak)">
            <span class="text-base">🔥</span>
            <span id="nav-streak-count">0</span>
            <span class="text-[11px] font-normal text-amber-600/80 dark:text-amber-400/80">วัน</span>
          </div>

          <!-- Theme Toggle Button -->
          <button id="btn-toggle-theme" class="p-2.5 rounded-2xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 transition text-base" title="เปลี่ยนโหมดมืด/สว่าง">
            🌙
          </button>
        </div>

      </div>
    </div>
  </header>

  <!-- Mobile Bottom Navigation Bar -->
  <div class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-slate-800/95 backdrop-blur-lg border-t border-slate-200 dark:border-slate-700 py-2 px-4 shadow-lg">
    <div class="flex items-center justify-around">
      <button class="nav-link flex flex-col items-center text-xs font-bold text-indigo-600 dark:text-indigo-400" data-view="library">
        <span class="text-lg">🏛️</span>
        <span class="mt-0.5">คลังมาตรา</span>
      </button>
      <button class="nav-link flex flex-col items-center text-xs font-medium text-slate-500 dark:text-slate-400" data-view="game">
        <span class="text-lg">🎮</span>
        <span class="mt-0.5">เกมพิมพ์</span>
      </button>
      <button class="nav-link flex flex-col items-center text-xs font-medium text-slate-500 dark:text-slate-400 relative" data-view="stats">
        <span class="text-lg">📈</span>
        <span class="mt-0.5">ทบทวน</span>
      </button>
      <button class="nav-link flex flex-col items-center text-xs font-medium text-slate-500 dark:text-slate-400" data-view="settings">
        <span class="text-lg">⚙️</span>
        <span class="mt-0.5">จัดการ</span>
      </button>
    </div>
  </div>

  <!-- Main View Container -->
  <main id="app-main" class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 lg:p-8 pb-24 md:pb-12">
    <!-- View content will be mounted here by app.js -->
  </main>

  <!-- Modal Mount Root -->
  <div id="modal-root"></div>

  <!-- Application Entrypoint -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
